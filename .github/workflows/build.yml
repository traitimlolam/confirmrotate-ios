name: Build ConfirmRotate DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/ConfirmRotate_iPhone13ProMax_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.3
          name: ConfirmRotate v1.0.3 (iPhone 13 Pro Max - iOS 16 RootHide)
          body: |
            ### 🔄 ConfirmRotate VN v1.0.3 (iOS 16 RootHide)
            - **Sửa triệt để 100% lỗi Safe Mode:**
              1. Loại bỏ hoàn toàn việc hook vào lớp SpringBoard gốc.
              2. Không tạo UIWindow trần, gắn view trực tiếp lên Window đang hoạt động.
              3. Loại bỏ toàn bộ các selector cũ không còn tồn tại trên iOS 16.
          files: output/*.deb
