name: Build ConfirmRotate DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/ConfirmRotate_v1.2.8_iPhone13ProMax_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.8
          name: ConfirmRotate v1.2.8 (Nhận Diện Gia Tốc Cực Nhạy Cho iOS 16 RootHide)
          body: |
            ### 🔄 ConfirmRotate v1.2.8 (iOS 16 RootHide)
            - **Khởi động cảm biến trực tiếp:** Khởi chạy `startMonitoring` ngay lập tức 1.5s sau khởi động, không phụ thuộc vào notification hệ thống.
            - **Thuật toán đo góc chuẩn `atan2(x, -y)`:** Bắt mọi góc nghiêng cực nhạy và chính xác (kể cả khi cầm nghiêng trên giường hay ngồi ghế).
            - **Nút bấm chuẩn gốc:** Capsule than chì `Rotate?` ở cạnh phải với icon gốc.
          files: output/*.deb
