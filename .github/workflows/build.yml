name: Build ConfirmRotate DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/ConfirmRotate_v1.2.7_iPhone13ProMax_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.7
          name: ConfirmRotate v1.2.7 (Đã Sửa Xung Đột DPKG Cho iOS 16 RootHide)
          body: |
            ### 🔄 ConfirmRotate v1.2.7 (iOS 16 RootHide)
            - **Sửa lỗi xung đột dpkg:** Đồng bộ Package ID để cài đè mượt mà không bị báo lỗi `trying to overwrite ConfirmRotate.dylib`.
            - **Chuẩn giao diện gốc CardboardFace:** Nút con nhộng màu tối `Rotate?` ở cạnh phải màn hình.
            - **Nhận diện phần cứng CoreMotion:** Xoay là hiện nút ngay lập tức, tương thích hoàn hảo iOS 16.
          files: output/*.deb
