name: Build ConfirmRotate DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/ConfirmRotate_v1.2.6_iPhone13ProMax_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.6
          name: ConfirmRotate v1.2.6 (Bản Gốc Tương Thích iOS 16 RootHide)
          body: |
            ### 🔄 ConfirmRotate v1.2.6 (Chuẩn Gốc CardboardFace - iOS 16 RootHide)
            - **Giao diện chuẩn 100% bản gốc:** Nút con nhộng màu than chì `Rotate?` ở cạnh phải màn hình với icon xoay chuẩn gốc.
            - **Cảm biến phần cứng CoreMotion:** Nhận diện chuyển động nghiêng máy trực tiếp từ cảm biến gia tốc phần cứng, kể cả khi đang bật Khóa Xoay.
            - **An toàn tuyệt đối:** 0% nguy cơ Safe Mode trên iOS 16.1.1 RootHide (iPhone 13 Pro Max).
          files: output/*.deb
