name: Build ConfirmRotate DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          chmod -R 755 layout/DEBIAN/
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/ConfirmRotate_v1.2.9_iPhone13ProMax_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.9
          name: ConfirmRotate v1.2.9 (Chuẩn Gốc iOS 14 - Nổi Mọi Nơi - Hoạt Động 100% Trên iOS 16)
          body: |
            ### 🔄 ConfirmRotate v1.2.9 (Bản Gốc iOS 14 Phục Hồi Hoàn Chỉnh Cho iOS 16)
            - **Cửa sổ nổi CRTouchWindow:** Nổi độc lập trên mọi ứng dụng (Safari, YouTube, Facebook, Cài đặt, Màn hình chính) với windowLevel cao nhất, không bị che khuất.
            - **Nhận diện xoay 2 tầng toàn hệ thống:** Hook trực tiếp `SBDeviceOrientationUpdateManager _enqueueOrientationUpdateToDeviceOrientation:` kết hợp cảm biến `CoreMotion atan2`.
            - **Giao diện chuẩn iOS 14:** Viên con nhộng than chì mờ (116x48pt), bo góc 24pt, icon xoay gốc, chữ `Rotate?` Helvetica-Bold.
            - **Bấm là xoay:** Đồng bộ mở khóa xoay qua `SBOrientationLockManager` và ép xoay màn hình `SpringBoard`.
          files: output/*.deb
